[project]
name = "mind-nav-app"
version = "0.2.0"
description = "Brain-Controlled Navigation via EEG — BCI Tester & Virtual Keyboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.5.3",
    "numpy>=2.4.2",
    "pyserial>=3.5",
    "scikit-learn==1.8.0",
    "scipy>=1.17.0",
    "scipy-stubs~=1.17.0",
    "torch>=2.10.0",
]

[project.scripts]
mind-nav = "main:main"
